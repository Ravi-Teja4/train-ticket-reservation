name: CI-CD Java App with SonarQube, Nexus, Tomcat

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven Packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # ✅ FIXED SONARQUBE COMMAND
      - name: SonarQube Scan
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=java-app \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Build Application
        run: mvn package -DskipTests

      - name: Upload Artifact to Nexus
        run: |
          ARTIFACT=$(find target -name "*.war")
          curl -v -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "$ARTIFACT" \
            "${{ secrets.NEXUS_REPO_URL }}/$(basename $ARTIFACT)"

      - name: Deploy WAR to Tomcat
        run: |
          WAR_FILE=$(find target -name "*.war")
          curl -T "$WAR_FILE" \
            "${{ secrets.TOMCAT_URL_DEV }}/manager/text/deploy?path=/myapp&update=true" \
            --user "${{ secrets.TOMCAT_USER_DEV }}:${{ secrets.TOMCAT_PASS_DEV }}"
