name: Build and Upload Artifact to Nexus

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # CHECKOUT CODE
      # -----------------------------
      - name: Checkout Code
        uses: actions/checkout@v3

      # -----------------------------
      # SETUP JAVA 17
      # -----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      # -----------------------------
      # BUILD PROJECT (WAR/JAR)
      # -----------------------------
      - name: Build Maven Project
        run: mvn clean package -DskipTests

      # -----------------------------
      # DEPLOY ARTIFACT TO NEXUS
      # -----------------------------
      - name: Upload Artifact to Nexus
        run: |
          mvn deploy \
            -DskipTests \
            -DaltDeploymentRepository=nexus::default::http://63.35.222.243:8081/repository/maven-releases/ \
            -Dnexus.username=${{ secrets.NEXUS_USERNAME }} \
            -Dnexus.password=${{ secrets.NEXUS_PASSWORD }}
