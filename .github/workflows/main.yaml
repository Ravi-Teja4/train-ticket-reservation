name: Build and Deploy WAR to Tomcat using Docker

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up JDK for Maven build
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build WAR file
      - name: Build WAR with Maven
        run: mvn clean package -DskipTests

      # 4. Verify WAR exists
      - name: Verify WAR exists
        run: ls -l target/*.war

      # 5. Build Docker Image
      - name: Build Docker Image
        run: docker build -t myapp:latest .

      # 6 (optional): Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7 (optional): Push Image
      - name: Push Docker Image
        run: |
          docker tag myapp:latest ${{ secrets.DOCKER_USERNAME }}/myapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest
