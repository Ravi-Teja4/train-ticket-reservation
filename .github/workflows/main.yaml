name: CI-CD Java App with SonarQube, Nexus, Tomcat

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven Repo
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # ------------------------------------------------------
      #           FIXED SONARQUBE STEP WITH TOKEN  
      # ------------------------------------------------------
      - name: SonarQube Scan
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.projectKey=TrainBook \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # ------------------------------------------------------
      #           BUILD JAVA WAR FILE
      # ------------------------------------------------------
      - name: Build WAR File
        run: mvn package -DskipTests

      # ------------------------------------------------------
      #           UPLOAD ARTIFACT TO NEXUS
      # ------------------------------------------------------
      - name: Upload Artifact to Nexus
        run: |
          ARTIFACT=$(find target -name "*.war")
          echo "Uploading $ARTIFACT to Nexus..."

          curl -v -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "$ARTIFACT" \
            "${{ secrets.NEXUS_REPO_URL }}/$(basename $ARTIFACT)"

      # ------------------------------------------------------
      #           DEPLOY WAR TO TOMCAT SERVER
      # ------------------------------------------------------
      - name: Deploy to Tomcat
        run: |
          WAR_FILE=$(find target -name "*.war")
          echo "Deploying $WAR_FILE to Tomcat..."

          curl -T "$WAR_FILE" \
            "${{ secrets.TOMCAT_URL_DEV }}/manager/text/deploy?path=/trainbook&update=true" \
            --user "${{ secrets.TOMCAT_USER_DEV }}:${{ secrets.TOMCAT_PASS_DEV }}"
