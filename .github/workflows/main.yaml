name: CI-CD Java App with SonarQube, Nexus, Tomcat

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Cache Maven packages
      - name: Cache Maven Packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # Run SonarQube Scan
      - name: SonarQube Scan
        run: mvn clean verify sonar:sonar \
            -Dsonar.projectKey=java-app \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # Build with Maven
      - name: Build Maven Project
        run: mvn clean package -DskipTests

      # Upload artifact to Nexus
      - name: Upload Artifact to Nexus
        run: |
          ARTIFACT_PATH=$(find target -name "*.war")
          echo "Uploading $ARTIFACT_PATH to Nexus..."

          curl -v -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "$ARTIFACT_PATH" \
            "${{ secrets.NEXUS_REPO_URL }}/$(basename $ARTIFACT_PATH)"

      # Deploy to Tomcat Server
      - name: Deploy WAR to Tomcat
        run: |
          WAR_FILE=$(find target -name "*.war")
          echo "Deploying $WAR_FILE to Tomcat..."

          curl -T "$WAR_FILE" \
            "${{ secrets.TOMCAT_URL_DEV }}/manager/text/deploy?path=/myapp&update=true" \
            --user "${{ secrets.TOMCAT_USER_DEV }}:${{ secrets.TOMCAT_PASS_DEV }}"
